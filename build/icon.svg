<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a15"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="28%" r="20%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#4ecdc4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="28%" r="6%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Inner dark area -->
  <rect x="40" y="40" width="432" height="432" rx="80" fill="#0d1117"/>

  <!-- Tunnel perspective lines -->
  <g stroke="#4ecdc4" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <!-- Left wall lines -->
    <line x1="80" y1="432" x2="241" y2="141"/>
    <line x1="120" y1="432" x2="246" y2="143"/>

    <!-- Right wall lines -->
    <line x1="432" y1="432" x2="271" y2="141"/>
    <line x1="392" y1="432" x2="266" y2="143"/>

    <!-- Ceiling -->
    <line x1="80" y1="120" x2="256" y2="141"/>
    <line x1="432" y1="120" x2="256" y2="141"/>
  </g>

  <!-- Floor grid lines -->
  <g stroke="#4ecdc4" stroke-width="4" stroke-linecap="round" opacity="0.4">
    <line x1="154" y1="200" x2="358" y2="200"/>
    <line x1="130" y1="260" x2="382" y2="260"/>
    <line x1="110" y1="330" x2="402" y2="330"/>
    <line x1="90" y1="400" x2="422" y2="400"/>
  </g>

  <!-- Glowing vanishing point -->
  <circle cx="256" cy="141" r="100" fill="url(#glowGrad)"/>

  <!-- Bright center point -->
  <circle cx="256" cy="141" r="30" fill="url(#centerGlow)"/>

  <!-- Border accent -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#4ecdc4" stroke-width="8" opacity="0.6"/>
</svg>
